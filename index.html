/* iPhone editing stability: avoid Safari focus zoom and horizontal overflow */
html,body{width:100%;max-width:100%;overflow-x:clip}
input,select,textarea{font-size:16px}
dialog{box-sizing:border-box;max-width:min(530px,calc(100vw - 20px));width:calc(100% - 20px);padding:16px;overflow-x:hidden;overscroll-behavior:contain}
#editor{max-height:calc(100dvh - 28px);padding-bottom:0}
#projectForm,#taskEditor{min-width:0;max-width:100%}
#projectForm>label,#projectForm>label input,#projectForm>label select,#projectForm>label textarea{min-width:0;max-width:100%}
.task-edit{min-width:0;max-width:100%;gap:6px}
.task-edit .task-name{min-width:0!important;flex:1 1 125px}
.task-edit button{flex:0 0 38px;min-width:38px;min-height:44px;padding:8px 4px}
.task-date-wrap{padding-left:0;min-width:0;width:100%;flex-basis:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.task-date-wrap label{white-space:normal}
.task-date{display:block;box-sizing:border-box;width:100%!important;max-width:100%!important;min-width:0!important;flex:1 1 auto!important;min-height:44px;margin:0!important;font-size:16px!important}
#projectForm>.row{position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:16px -16px 0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#202b3b;border-top:1px solid #526078;box-shadow:0 -8px 18px #10141e88}
#projectForm>.row button{width:100%;min-width:0;min-height:50px;padding:12px 8px;font-size:16px;touch-action:manipulation}
#addTaskButton{min-height:46px}
@media(max-width:600px){.task-date{width:100%!important;flex-basis:auto!important}.task-edit .task-name{min-width:0!important}.task-edit button{min-width:38px;padding:8px 4px}}

/* Compact mobile-first layout: no horizontal movement, fewer stacked controls */
#editor{padding:14px 14px 0;scrollbar-gutter:stable}
#editor h2{position:sticky;top:-14px;z-index:4;background:#202b3b;margin:-14px -14px 12px;padding:15px 14px 11px;border-bottom:1px solid #39485c;font-size:19px}
#projectForm>label{font-size:13px;font-weight:600}
#projectForm input:not([type=checkbox]),#projectForm select,#projectForm textarea{margin:4px 0 9px;padding:9px 11px;min-height:43px}
#projectForm textarea{min-height:56px;resize:vertical}
.editor-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0}
.editor-fields>label{min-width:0;font-size:13px;font-weight:600}
.editor-fields input,.editor-fields select{width:100%;min-width:0;max-width:100%}
.editor-section-title{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin:9px 0 7px;padding-top:10px;border-top:1px solid #435064}
.editor-section-title strong{font-size:16px}
.editor-section-title span{font-size:11px;color:#aabbd2;text-align:right}
#taskEditor{display:grid;gap:7px}
.task-edit{display:grid;grid-template-columns:25px minmax(0,1fr) 34px 34px 34px;align-items:center;gap:6px;margin:0;padding:9px;background:#182333;border:1px solid #3a4b61;border-radius:11px}
.task-edit>input[type=checkbox]{grid-column:1;width:21px;height:21px}
.task-edit .task-name{grid-column:2;width:100%;min-width:0!important;margin:0!important;min-height:40px!important;padding:8px!important}
.task-edit button{min-width:0!important;min-height:40px!important;padding:6px 0!important;border-radius:8px}
.task-date-wrap{grid-column:2 / -1;display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:8px;padding:0;margin:0;min-width:0}
.task-date-wrap label{font-size:12px;font-weight:600;color:#9bc8ff}
#projectForm .task-date{min-height:40px!important;height:40px;padding:6px 8px!important;margin:0!important}
#projectForm>.row{margin:12px -14px 0;padding:10px 14px max(10px,env(safe-area-inset-bottom))}
#addTaskButton{width:100%;margin-top:10px;min-height:42px}
#projects .card{padding:14px;margin:10px 0}
#projects .card h2{font-size:18px;margin:0}
#projects .card p{margin:8px 0}
#projects .progress{height:9px}
#projects .project-details{margin:10px 0;border:1px solid #3b4b61;border-radius:9px;overflow:hidden}
#projects .project-details summary{cursor:pointer;padding:11px;background:#29384d;font-size:14px;font-weight:650;list-style-position:inside}
#projects .project-details .task{padding:10px 12px}
#projects .project-notes{font-size:13px;white-space:pre-wrap}
@media(max-width:390px){.task-edit{grid-template-columns:24px minmax(0,1fr) 32px 32px 32px;gap:4px;padding:7px}.editor-fields{gap:7px}.task-date-wrap{grid-template-columns:48px minmax(0,1fr)}}

/* Compact dashboard: show totals at a glance and expand only the needed section */
#dashboard{padding:14px 16px}
#dashboard h2{margin:0 0 5px;font-size:18px}
#dashboard>p.muted{margin:0;font-size:12px;line-height:1.5}
#dashboard .dashboard-stats{margin:10px 0;gap:6px}
#dashboard .stat{padding:9px 4px;border-radius:9px}
#dashboard .stat strong{font-size:23px}
#dashboard .stat small{font-size:11px}
#dashboard .stat-alert{border-color:#e56b75;background:#492b38}
#dashboard .compact-agenda{margin:7px 0 0;border:1px solid #40516a;border-radius:9px;overflow:hidden}
#dashboard .compact-agenda>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer;background:#29384d;font-size:14px;font-weight:700;list-style:none}
#dashboard .compact-agenda>summary::-webkit-details-marker{display:none}
#dashboard .compact-agenda.late>summary{background:#57333e}
#dashboard .agenda-summary-count{color:#b9cbe1;font-size:12px;white-space:nowrap}
#dashboard .compact-agenda[open] .agenda-summary-count span{display:inline-block;transform:rotate(180deg)}
#dashboard .agenda-contents{padding:4px 9px 9px}
#dashboard .agenda-item{padding:9px;margin:5px 0;background:#182333}
#dashboard .agenda-main{display:flex;gap:7px;align-items:flex-start}
#dashboard .agenda-main strong{font-size:13px;line-height:1.5;overflow-wrap:anywhere}
#dashboard .agenda-type{flex-shrink:0;font-size:11px;padding:2px 5px;border-radius:4px}
#dashboard .agenda-type.deadline{background:#713846;color:#ffe5e8}
#dashboard .agenda-type.task{background:#284e79;color:#dcecff}
#dashboard .agenda-item p{font-size:12px;margin:5px 0}
#dashboard .agenda-item button{font-size:12px;padding:8px 10px;margin-top:3px}

/* CREATOR WORKSPACE — monochrome graphite design system */
:root{color-scheme:dark;--surface:#111113;--raised:#18181b;--edge:#2c2c31;--ink:#f4f4f5;--sub:#a1a1aa}
html{background:#080809}
body{background:#09090b!important;color:var(--ink)!important;letter-spacing:.012em;-webkit-font-smoothing:antialiased}
header{background:#0e0e10!important;border-bottom:1px solid #27272a;padding:28px 16px 23px}
h1{font-size:clamp(21px,5vw,28px);font-weight:750;letter-spacing:.13em}
header p,.muted{color:#a1a1aa!important}
main{max-width:880px;padding:12px 14px 35px}
h2{font-size:18px;letter-spacing:.015em}
.card{background:#151518!important;border:1px solid #29292e;border-radius:15px;padding:16px;margin:11px 0;box-shadow:0 5px 20px #0000001c}
button{background:#f4f4f5!important;color:#111113!important;border:1px solid #f4f4f5!important;border-radius:9px;font-weight:700;transition:background .15s,border-color .15s}
button.secondary{background:#27272b!important;color:#e7e7e9!important;border-color:#38383d!important}
button.danger{background:#302025!important;color:#ffb4bd!important;border-color:#563039!important}
button:active{filter:brightness(.88)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #f5f5f5;outline-offset:2px}
input,select,textarea{background:#101012!important;border-color:#44444b!important;color:#f5f5f5!important}
input::placeholder,textarea::placeholder{color:#85858e}
label{color:#d0d0d4}
.toolbar{gap:10px}
.toolbar select{background:#1c1c20!important}
.tag{background:#2a2a30;color:#e4e4e7;border:1px solid #38383f;font-weight:650}
.progress{background:#303036!important;height:9px}
.bar{background:linear-gradient(90deg,#b8b8bf,#f4f4f5)!important}
.task{border-color:#303035}
.task input[type=checkbox],.task-edit input[type=checkbox]{accent-color:#d4d4d8}
.stat{background:#101013!important;border:1px solid #2f2f35!important;border-radius:11px}
.stat strong{color:#f5f5f5}
.stat small{color:#a1a1aa!important}
.agenda-item{background:#111114!important;border:1px solid #303036!important;border-radius:10px}
.agenda-group h3{font-weight:700}
.cal-day{background:#101013!important;border-color:#313137!important;border-radius:8px}
.cal-day.has-events{border-color:#5b5b65}
.cal-week{color:#9c9ca6}
.cal-count.deadline{background:#6a2935!important;color:#ffe1e6!important}
.cal-count.task{background:#213f65!important;color:#d8e9ff!important}
.cal-day.has-deadline{border-color:#e56b75!important}
.cal-day.has-task:not(.has-deadline){border-color:#67a8f5!important}
.cal-legend{color:#c5c5cc}
.day-entry{border-color:#333339}
#projects .card{background:#151518!important}
#projects .project-details{border-color:#36363b!important}
#projects .project-details summary{background:#202024!important;color:#e8e8eb!important}
#projects .project-details .task{background:#151518}
#editor,dialog{background:#17171a!important;border:1px solid #414147!important;color:#f5f5f5!important;box-shadow:0 20px 80px #000a}
#editor h2{background:#17171a!important;border-bottom-color:#333338!important}
#projectForm .task-edit{background:#1d1d21!important;border-color:#36363e!important}
#projectForm .task-edit input{background:#101013!important}
#projectForm .task-date-wrap label{color:#9ac9ff!important}
#projectForm .task-date{border-color:#67a8f5!important}
#projectForm .deadline-field{color:#ff9ba4!important}
#projectForm .deadline-field input{border-color:#e56b75!important}
#projectForm>.row{background:#17171a!important;border-top:1px solid #38383e!important}
#addTaskButton{background:#28282e!important}
.message{background:#242429}
.message.error{background:#45232b}
.linkbutton{background:transparent!important;border:0!important;color:#d4d4d8!important}
#account{color:#a1a1aa}
@media(max-width:600px){main{padding:10px 10px 28px}.card{padding:13px;border-radius:13px}header{padding:25px 12px 20px}h1{letter-spacing:.075em}#projects .card{padding:13px}}

<section id="setup" class="card hidden"><h2>接続設定が必要です</h2><p id="setupMessage"></p></section>
<section id="login" class="card hidden"><h2>ログイン</h2><form id="loginForm"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton">ログイン</button></form><p id="loginMessage" class="message hidden" role="status"></p><button type="button" class="linkbutton" id="forgotButton">パスワードを忘れた・初めて設定する</button></section>
<section id="reset" class="card hidden"><h2>新しいパスワードを設定</h2><form id="resetForm"><label>新しいパスワード<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>確認用<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button id="resetButton">パスワードを保存する</button></form><p id="resetMessage" class="message hidden"></p></section>
<section id="workspace" class="hidden"><div class="top"><div><h2>制作プロジェクト</h2><p id="count" class="muted"></p><p id="account" class="muted"></p></div><div class="row"><button id="newButton">＋ 新規登録</button><button class="secondary" id="reloadButton">更新</button><button class="secondary" id="logoutButton">ログアウト</button></div></div><p id="workspaceMessage" class="message hidden" role="status"></p>
<div class="toolbar"><label>担当者 <select id="assigneeFilter"><option value="">全員</option></select></label><label>並び順 <select id="sortOrder"><option value="deadline">納期順</option><option value="newest">登録順</option><option value="priority">優先度順</option></select></label></div>
<section class="card" id="dashboard"><h2>作業ダッシュボード</h2><p class="muted">未完了の工程と制作物の納期を自動集計。担当者フィルターと連動します。</p><div id="dashboardContent"></div></section>
<section class="card"><div class="top"><button class="secondary" id="prevMonth">前月</button><h2 id="monthTitle"></h2><button class="secondary" id="nextMonth">翌月</button></div><div class="cal-legend"><span><i class="cal-swatch deadline"></i>最終納期</span><span><i class="cal-swatch task"></i>工程予定日</span></div><div id="calendar" class="calendar"></div><p class="muted">赤は最終納期、青は工程予定日です。日付をタップすると詳細を確認できます。</p></section><div id="projects"></div></section></main>
<dialog id="editor"><h2 id="formTitle">制作物を登録</h2><form id="projectForm"><input id="projectId" type="hidden"><label>制作物の名前<input id="projectName" required></label><div class="editor-fields"><label>制作カテゴリ<select id="category"><option>衣装</option><option>ウィッグ</option><option>3Dプリンター</option><option>造形・小道具</option><option>展示品</option><option>その他</option></select></label><label>担当者<input id="assignee" placeholder="例：ねこ"></label></div><div class="editor-fields"><label class="deadline-field">最終納期<input type="date" id="deadline"></label><label>優先度<select id="priority"><option>通常</option><option>高</option><option>最優先</option></select></label></div><label>備考<textarea id="notes" rows="3"></textarea></label><div class="editor-section-title"><strong>制作工程</strong><span>チェックで完了・矢印で並び替え</span></div><div id="taskEditor"></div><button type="button" class="secondary" id="addTaskButton">＋ 工程を追加</button><div class="row"><button id="saveButton" type="submit">保存する</button><button type="button" class="secondary" id="cancelButton">キャンセル</button></div></form></dialog>
<dialog id="dayDialog"><div class="top"><h2 id="dayTitle">予定</h2><button type="button" class="secondary" id="closeDayButton">閉じる</button></div><div id="dayEntries"></div></dialog>

const $=id=>document.getElementById(id);const editor=$('editor'),form=$('projectForm');let db=null,data=[],currentUser=null,busy=false,recoveryMode=false,refreshVersion=0,editingTasks=[];let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const recoveryLink=location.hash.includes('type=recovery')||location.search.includes('type=recovery');
function show(id){['setup','login','reset','workspace'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function errText(e){return e?.message||'通信に失敗しました。';}
function setMessage(id,t,error=false){const e=$(id);e.textContent=t;e.classList.toggle('hidden',!t);e.classList.toggle('error',error);}
function message(t,e=false){setMessage('workspaceMessage',t,e);}
function normalize(p){return {...p,tasks:Array.isArray(p.tasks)?p.tasks.map(t=>({...t,date:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:''})):[]};}
function progress(p){return p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0;}
function status(p){return p.tasks.length&&progress(p)===100?'完了':p.tasks.some(t=>t.done)?'進行中':'未着手';}
function payload(p){return {name:p.name,category:p.category,assignee:p.assignee,deadline:p.deadline||null,priority:p.priority,notes:p.notes,tasks:p.tasks,progress:progress(p),status:status(p)};}
async function refresh(){if(!currentUser||recoveryMode)return;const version=++refreshVersion;message('読み込み中…');try{const {data:rows,error}=await db.from('projects').select('id,name,category,assignee,deadline,priority,notes,tasks,progress,status').order('id',{ascending:false});if(error)throw error;if(version!==refreshVersion||!currentUser||recoveryMode)return;data=(rows||[]).map(normalize);message('');render();}catch(e){if(version===refreshVersion)message('読み込みエラー：'+errText(e),true);}}
function renderTaskEditor(){$('taskEditor').innerHTML=editingTasks.map((t,i)=>`<div class="task-edit"><input type="checkbox" data-check="${i}" ${t.done?'checked':''} aria-label="完了"><input type="text" data-name="${i}" value="${esc(t.name)}" aria-label="工程名" class="task-name"><button type="button" class="secondary" data-move="${i}" data-dir="-1">↑</button><button type="button" class="secondary" data-move="${i}" data-dir="1">↓</button><button type="button" class="danger" data-delete="${i}">×</button><div class="task-date-wrap"><label for="taskDate${i}">予定日</label><input class="task-date" id="taskDate${i}" type="date" data-date="${i}" value="${esc(t.date||'')}"></div></div>`).join('');}
$('taskEditor').addEventListener('input',e=>{if(e.target.dataset.name!==undefined)editingTasks[+e.target.dataset.name].name=e.target.value;});
$('taskEditor').addEventListener('change',e=>{if(e.target.dataset.check!==undefined)editingTasks[+e.target.dataset.check].done=e.target.checked;if(e.target.dataset.date!==undefined)editingTasks[+e.target.dataset.date].date=e.target.value;});
$('taskEditor').addEventListener('click',e=>{const del=e.target.closest('[data-delete]');if(del){editingTasks.splice(+del.dataset.delete,1);renderTaskEditor();return;}const m=e.target.closest('[data-move]');if(m){const i=+m.dataset.move,j=i+(+m.dataset.dir);if(j>=0&&j<editingTasks.length){[editingTasks[i],editingTasks[j]]=[editingTasks[j],editingTasks[i]];renderTaskEditor();}}});
$('addTaskButton').addEventListener('click',()=>{editingTasks.push({name:'新しい工程',done:false,date:''});renderTaskEditor();});
$('category').addEventListener('change',()=>{if($('projectId').value)return;editingTasks=templates[$('category').value].map(name=>({name,done:false}));renderTaskEditor();});
let editorReturnScrollY=0;
function closeEditorStable(){
  const focused=document.activeElement;
  if(focused&&editor.contains(focused)&&typeof focused.blur==='function')focused.blur();
  editor.close();
  const restore=()=>{if(!editor.open)window.scrollTo({top:editorReturnScrollY,left:0,behavior:'instant'});};
  requestAnimationFrame(restore);
  setTimeout(restore,180);
  setTimeout(restore,420);
}
function openForm(id){if(busy||!currentUser)return;editorReturnScrollY=window.scrollY;form.reset();$('projectId').value='';$('formTitle').textContent='制作物を登録';editingTasks=templates[$('category').value].map(name=>({name,done:false}));if(id!==undefined){const p=data.find(x=>String(x.id)===String(id));if(!p)return;$('projectId').value=String(p.id);$('projectName').value=p.name||'';$('category').value=p.category||'その他';$('assignee').value=p.assignee||'';$('deadline').value=p.deadline||'';$('priority').value=p.priority||'通常';$('notes').value=p.notes||'';editingTasks=p.tasks.map(t=>({...t}));$('formTitle').textContent='制作物を編集';}renderTaskEditor();editor.showModal();}
$('newButton').addEventListener('click',()=>openForm());$('cancelButton').addEventListener('click',closeEditorStable);
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!currentUser)return;const id=$('projectId').value;const p={name:$('projectName').value.trim(),category:$('category').value,assignee:$('assignee').value.trim(),deadline:$('deadline').value,priority:$('priority').value,notes:$('notes').value.trim(),tasks:editingTasks.map(t=>({name:String(t.name).trim(),done:!!t.done,date:t.date||''})).filter(t=>t.name)};if(!p.name)return;busy=true;$('saveButton').disabled=true;if(document.activeElement&&editor.contains(document.activeElement))document.activeElement.blur();try{const q=id?db.from('projects').update(payload(p)).eq('id',Number(id)).select('id'):db.from('projects').insert(payload(p)).select('id');const {data:result,error}=await q;if(error)throw error;if(!result?.length)throw Error('保存対象が見つかりません。');closeEditorStable();await refresh();}catch(err){alert('保存できませんでした：'+errText(err));}finally{busy=false;$('saveButton').disabled=false;}});
async function toggleTask(id,index,checked){if(busy||!currentUser)return;const p=data.find(x=>String(x.id)===String(id));if(!p||!p.tasks[index])return;const old=p.tasks.map(t=>({...t}));p.tasks[index].done=checked;render();busy=true;try{const {data:result,error}=await db.from('projects').update({tasks:p.tasks,progress:progress(p),status:status(p)}).eq('id',Number(id)).select('id');if(error)throw error;if(!result?.length)throw Error('更新対象が見つかりません。');await refresh();}catch(err){p.tasks=old;render();message('工程の保存に失敗：'+errText(err),true);}finally{busy=false;}}
async function deleteProject(id){if(busy||!currentUser||!confirm('この制作物を削除しますか？'))return;busy=true;try{const {data:result,error}=await db.from('projects').delete().eq('id',Number(id)).select('id');if(error)throw error;if(!result?.length)throw Error('削除対象が見つかりません。');await refresh();}catch(err){message('削除できませんでした：'+errText(err),true);}finally{busy=false;}}
function calendarEntries(key){const selected=$('assigneeFilter').value;const items=[];for(const p of data){if(selected&&p.assignee!==selected)continue;if(p.deadline===key)items.push({p,type:'deadline'});p.tasks.forEach((t,i)=>{if(t.date===key)items.push({p,type:'task',task:t,index:i});});}return items;}
function openDay(key){if(!/^\d{4}-\d{2}-\d{2}$/.test(key))return;const entries=calendarEntries(key);if(!entries.length)return;$('dayTitle').textContent=key.replace(/-/g,'/')+' の予定';$('dayEntries').innerHTML=entries.map(item=>{const p=item.p,task=item.task;return `<div class="day-entry ${item.type}"><strong>${item.type==='deadline'?'【最終納期】':'【工程予定日】'} ${esc(p.name)}</strong>${task?`<p>${esc(task.name)} ${task.done?'（完了）':'（未完了）'}</p>`:''}<p class="muted">${esc(p.category||'その他')} ／ 担当：${esc(p.assignee||'未設定')}</p><p class="muted">進捗 ${progress(p)}% ／ 優先度：${esc(p.priority||'通常')}</p><button type="button" class="secondary" data-edit-day="${Number(p.id)}">編集・工程管理</button></div>`;}).join('');$('dayDialog').showModal();}
$('closeDayButton').addEventListener('click',()=>$('dayDialog').close());
$('dayEntries').addEventListener('click',e=>{const button=e.target.closest('[data-edit-day]');if(!button)return;const id=Number(button.dataset.editDay);$('dayDialog').close();openForm(id);});
$('calendar').addEventListener('click',e=>{const day=e.target.closest('[data-day]');if(day)openDay(day.dataset.day);});
$('calendar').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const day=e.target.closest('[data-day]');if(day){e.preventDefault();openDay(day.dataset.day);}});
function renderCalendar(){const root=$('calendar'),y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();$('monthTitle').textContent=`${y}年${m+1}月`;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let html=['日','月','火','水','木','金','土'].map(d=>`<div class="cal-week">${d}</div>`).join('');for(let slot=0;slot<Math.ceil((first+days)/7)*7;slot++){const d=slot-first+1;if(d<1||d>days){html+='<div class="cal-day cal-other"></div>';continue;}const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const entries=calendarEntries(key),has=entries.length>0;const deadlines=entries.filter(x=>x.type==='deadline').length,tasks=entries.length-deadlines;html+=`<div class="cal-day${has?' has-events':''}${deadlines?' has-deadline':''}${tasks?' has-task':''}"${has?` role="button" tabindex="0" data-day="${key}" aria-label="${d}日、最終納期${deadlines}件、工程予定${tasks}件"`:''}><strong>${d}</strong>${deadlines?`<span class="cal-count deadline">納期 ${deadlines}件</span>`:''}${tasks?`<span class="cal-count task">工程 ${tasks}件</span>`:''}</div>`;}root.innerHTML=html;}
function localDateKey(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function renderDashboard(){
 const selected=$('assigneeFilter').value;
 const today=new Date();today.setHours(0,0,0,0);
 const todayKey=localDateKey(today),end=new Date(today);end.setDate(end.getDate()+7);
 const endKey=localDateKey(end),groups={late:[],today:[],soon:[]};
 for(const p of data){
  if(selected&&p.assignee!==selected)continue;
  const items=[];
  for(const t of p.tasks){if(!t.done&&t.date)items.push({date:t.date,title:t.name,type:'工程',p});}
  if(p.deadline&&progress(p)<100)items.push({date:p.deadline,title:'制作物の納期',type:'納期',p});
  for(const item of items){if(item.date<todayKey)groups.late.push(item);else if(item.date===todayKey)groups.today.push(item);else if(item.date<=endKey)groups.soon.push(item);}
 }
 for(const items of Object.values(groups))items.sort((a,b)=>a.date.localeCompare(b.date)||((a.p.priority==='最優先')?-1:0));
 const labels=[['late','期限超過'],['today','今日やること'],['soon','今後7日間']];
 const stats=`<div class="dashboard-stats">${labels.map(([key,label])=>`<div class="stat${key==='late'&&groups[key].length?' stat-alert':''}"><strong>${groups[key].length}</strong><small>${label}</small></div>`).join('')}</div>`;
 const itemHTML=item=>`<div class="agenda-item"><div class="agenda-main"><span class="agenda-type ${item.type==='納期'?'deadline':'task'}">${item.type==='納期'?'納期':'工程'}</span><strong>${esc(item.p.name)} ／ ${esc(item.title)}</strong></div><p class="muted">${esc(item.date)} ・ 担当：${esc(item.p.assignee||'未設定')} ・ 優先度：${esc(item.p.priority||'通常')}</p><button type="button" class="secondary" data-dashboard-edit="${Number(item.p.id)}">編集・工程管理</button></div>`;
 const sections=labels.filter(([key])=>groups[key].length).map(([key,label])=>`<details class="agenda-group compact-agenda ${key}" ${key==='late'?'open':''}><summary><span>${label}</span><span class="agenda-summary-count">${groups[key].length}件 <span aria-hidden="true">▾</span></span></summary><div class="agenda-contents">${groups[key].map(itemHTML).join('')}</div></details>`).join('');
 $('dashboardContent').innerHTML=stats+(sections||'<p class="agenda-empty">直近7日間に未完了の予定はありません。</p>');
}
$('dashboardContent').addEventListener('click',e=>{const b=e.target.closest('[data-dashboard-edit]');if(b)openForm(b.dataset.dashboardEdit);});
const expandedProjects=new Set();
$('projects').addEventListener('toggle',e=>{const el=e.target;if(!el.matches?.('details[data-project-id]'))return;const id=el.dataset.projectId;if(el.open)expandedProjects.add(id);else expandedProjects.delete(id);},true);
function render(){const root=$('projects');$('count').textContent=data.length+'件の制作物';const sel=$('assigneeFilter'),chosen=sel.value,names=[...new Set(data.map(p=>p.assignee).filter(Boolean))].sort();sel.innerHTML='<option value="">全員</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');sel.value=names.includes(chosen)?chosen:'';renderCalendar();renderDashboard();const rank={'最優先':0,'高':1,'通常':2},order=$('sortOrder').value;const visible=data.filter(p=>!sel.value||p.assignee===sel.value).sort((a,b)=>order==='priority'?(rank[a.priority]??3)-(rank[b.priority]??3):order==='newest'?Number(b.id)-Number(a.id):(a.deadline||'9999-12-31').localeCompare(b.deadline||'9999-12-31'));if(!visible.length){root.innerHTML='<div class="card muted">表示する制作物がありません。</div>';return;}const today=new Date(),todayText=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');root.innerHTML=visible.map(p=>{const done=p.tasks.filter(t=>t.done).length,percent=progress(p),overdue=p.deadline&&p.deadline<todayText&&percent<100;return `<section class="card"><div class="top"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.priority||'通常')}</span></div><p class="muted">${esc(p.category||'その他')} ／ 担当：${esc(p.assignee||'未設定')}</p><p class="muted">納期：${esc(p.deadline||'未設定')}${overdue?'（期限超過）':''}</p><div class="top"><strong>進捗率</strong><strong>${percent}%</strong></div><div class="progress"><div class="bar" style="width:${percent}%"></div></div><details class="project-details" data-project-id="${Number(p.id)}" ${expandedProjects.has(String(p.id))?'open':''}><summary>工程を表示・チェック（${done}/${p.tasks.length} 完了）</summary>${p.tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${Number(p.id)},${i},this.checked)"><span>${esc(t.name)}${t.date?` <small class="muted">（予定：${esc(t.date)}）</small>`:''}</span></label>`).join('')}</details>${p.notes?`<p class="project-notes muted">${esc(p.notes)}</p>`:''}<div class="row"><button class="secondary" onclick="openForm(${Number(p.id)})">編集・工程管理</button><button class="danger" onclick="deleteProject(${Number(p.id)})">削除</button></div></section>`;}).join('');}
$('reloadButton').addEventListener('click',refresh);$('assigneeFilter').addEventListener('change',render);$('sortOrder').addEventListener('change',render);$('prevMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendar();});$('nextMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendar();});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;$('loginButton').disabled=true;setMessage('loginMessage','');try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';}catch(err){setMessage('loginMessage','ログインできませんでした：'+errText(err),true);}finally{$('loginButton').disabled=false;}});
$('forgotButton').addEventListener('click',async()=>{if(!db)return;let email=$('email').value.trim();if(!email)email=(prompt('登録済みのメールアドレスを入力してください。')||'').trim();if(!email)return;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMessage('loginMessage','メールアドレスの形式を確認してください。',true);return;}$('email').value=email;$('forgotButton').disabled=true;try{const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});if(error)throw error;setMessage('loginMessage','再設定メールを送信しました。メール内のリンクから新しいパスワードを設定してください。');}catch(err){setMessage('loginMessage','送信に失敗：'+errText(err),true);}finally{$('forgotButton').disabled=false;}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();if(!db||!recoveryMode)return;const p=$('newPassword').value;if(p.length<8||p!==$('confirmPassword').value){setMessage('resetMessage','8文字以上で、確認用と同じパスワードを入力してください。',true);return;}$('resetButton').disabled=true;try{const {error}=await db.auth.updateUser({password:p});if(error)throw error;recoveryMode=false;await db.auth.signOut();currentUser=null;data=[];show('login');setMessage('loginMessage','パスワードを設定しました。新しいパスワードでログインしてください。');history.replaceState(null,'',location.pathname);}catch(err){setMessage('resetMessage','設定に失敗：'+errText(err),true);}finally{$('resetButton').disabled=false;}});
$('logoutButton').addEventListener('click',async()=>{if(!db)return;const {error}=await db.auth.signOut();if(error)message('ログアウト失敗：'+errText(error),true);});
async function setSession(session){currentUser=session?.user||null;if(recoveryMode){show('reset');return;}if(currentUser){$('account').textContent=currentUser.email||'';show('workspace');await refresh();}else{refreshVersion++;data=[];show('login');}}
async function init(){if(!window.supabase?.createClient){show('setup');$('setupMessage').textContent='Supabaseライブラリを読み込めませんでした。';return;}try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);recoveryMode=recoveryLink;db.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;currentUser=session?.user||null;show('reset');return;}if(event==='SIGNED_OUT'){if(!recoveryMode)setSession(null);return;}if(event==='INITIAL_SESSION'||event==='SIGNED_IN')setSession(session);},0);});const {data:sessionData,error}=await db.auth.getSession();if(error)throw error;await setSession(sessionData.session);const params=new URLSearchParams(location.hash.slice(1));if(params.get('error_description')){recoveryMode=false;show('login');setMessage('loginMessage','認証リンクが無効または期限切れです。',true);}}catch(err){show('setup');$('setupMessage').textContent='初期化に失敗：'+errText(err);}}
init();
</script></body></html>
