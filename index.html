
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREATOR WORKSPACE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141e;color:#f5f5f5;font-family:-apple-system,"Helvetica Neue",sans-serif}
header{background:#1d2635;text-align:center;padding:32px 16px}
h1{font-size:25px;margin:0 0 10px}
header p{color:#aeb9ca;margin:0}
main{padding:20px;max-width:850px;margin:auto}
h2{font-size:21px}
button,input,select,textarea{font:inherit}
button{background:#80b5ff;color:#10141e;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#344256;color:white}
button.danger{background:#603541;color:white}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;background:#172132;border:1px solid #526078;border-radius:8px;color:white}
label{display:block;color:#c9d3e2;font-size:14px}
.card{background:#202b3b;border-radius:14px;padding:18px;margin:15px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:#aeb9ca;font-size:14px}
.progress{height:12px;background:#3c4859;border-radius:20px;overflow:hidden;margin:12px 0}
.bar{height:100%;background:#80b5ff;transition:width .2s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;background:#344256;padding:5px 10px;border-radius:20px;font-size:12px}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #394557}
.task input{width:20px;height:20px;margin:0;flex-shrink:0}
.task span{flex:1}
dialog{background:#202b3b;color:white;border:1px solid #526078;border-radius:14px;width:calc(100% - 24px);max-width:500px;max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:#aeb9ca;text-align:center;padding:35px 10px}
.hidden{display:none!important}
.message{padding:12px;border-radius:8px;background:#344256;margin:12px 0;white-space:pre-wrap}
.error{background:#603541}
#login,#reset{max-width:430px;margin:20px auto}
#account{font-size:13px;overflow-wrap:anywhere}
button:focus-visible,input:focus-visible{outline:2px solid #80b5ff}
.linkbutton{background:transparent;color:#a9cbff;padding:8px 0;text-decoration:underline}
</style>
</head>
<body>

<header>
<h1>CREATOR WORKSPACE</h1>
<p>クリエイター制作管理システム</p>
</header>

<main>

<section id="setup" class="card hidden">
<h2>接続設定が必要です</h2>
<p id="setupMessage">Supabaseの接続設定を確認してください。</p>
</section>

<section id="login" class="card hidden">
<h2>ログイン</h2>
<p class="muted">登録済みのアカウントでログインしてください。</p>

<form id="loginForm">
<label>メールアドレス
<input type="email" id="email" autocomplete="username" required>
</label>
<label>パスワード
<input type="password" id="password" autocomplete="current-password" required>
</label>
<button type="submit" id="loginButton">ログイン</button>
</form>

<p id="loginMessage" class="message hidden" role="status"></p>

<button type="button" class="linkbutton" id="forgotButton">
パスワードを忘れた・初めて設定する
</button>
</section>

<section id="reset" class="card hidden">
<h2>新しいパスワードを設定</h2>
<p class="muted">
メールの再設定リンクからアクセスしました。
新しいパスワードを設定してください。
</p>

<form id="resetForm">
<label>新しいパスワード
<input type="password" id="newPassword"
autocomplete="new-password" minlength="8" required>
</label>

<label>新しいパスワード（確認）
<input type="password" id="confirmPassword"
autocomplete="new-password" minlength="8" required>
</label>

<button type="submit" id="resetButton">
パスワードを保存する
</button>
</form>

<p id="resetMessage" class="message hidden" role="status"></p>
</section>

<section id="workspace" class="hidden">
<div class="top">
<div>
<h2>制作プロジェクト</h2>
<p class="muted" id="count">0件</p>
<p class="muted" id="account"></p>
</div>
<div class="row">
<button onclick="openForm()" id="newButton">＋ 新規登録</button>
<button class="secondary" id="reloadButton">更新</button>
<button class="secondary" id="logoutButton">ログアウト</button>
</div>
</div>

<p id="workspaceMessage" class="message hidden" role="status"></p>
<div id="projects"></div>
</section>

</main>

<dialog id="editor">
<h2 id="formTitle">制作物を登録</h2>

<form id="projectForm">
<input type="hidden" id="projectId">

<label>制作物の名前
<input id="projectName" required placeholder="例：デスザーク衣装">
</label>

<label>制作カテゴリ
<select id="category">
<option>衣装</option>
<option>ウィッグ</option>
<option>3Dプリンター</option>
<option>造形・小道具</option>
<option>展示品</option>
<option>その他</option>
</select>
</label>

<label>担当者
<input id="assignee" placeholder="例：ねこ">
</label>

<label>納期
<input type="date" id="deadline">
</label>

<label>優先度
<select id="priority">
<option>通常</option>
<option>高</option>
<option>最優先</option>
</select>
</label>

<label>備考
<textarea id="notes" rows="3"></textarea>
</label>

<div class="actions">
<button type="submit" id="saveButton">保存する</button>
<button type="button" class="secondary" onclick="editor.close()">
キャンセル
</button>
</div>
</form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';

const SUPABASE_URL='https://wnvmhxzqnrtlvaiislkh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_dMpkJB_Pg6KQILD_T5tTOA_Bf5EsfdM';

const SITE_URL='https://nhkk6zprtg-gif.github.io/creator-workspace/';

const templates={
'衣装':['資料確認','採寸・型紙','生地・材料調達','裁断','縫製','装飾','試着・調整','完成確認'],
'ウィッグ':['資料確認','ウィッグ調達','カット','セット・造形','仕上げ','完成確認'],
'3Dプリンター':['データ準備','スライス設定','材料準備','出力','サポート除去','研磨・塗装','完成確認'],
'造形・小道具':['資料確認','設計・型紙','材料調達','造形','表面処理','塗装','完成確認'],
'展示品':['企画','設計','材料調達','制作','組み立て','仕上げ','完成確認'],
'その他':['準備','制作','確認','完成']
};

const $=id=>document.getElementById(id);
const editor=$('editor');
const form=$('projectForm');

let db=null;
let data=[];
let currentUser=null;
let busy=false;
let recoveryMode=false;
let refreshVersion=0;

const initialHash=window.location.hash;
const initialSearch=window.location.search;

const recoveryLink=
initialHash.includes('type=recovery')||
initialSearch.includes('type=recovery');

function show(id){
for(const section of ['setup','login','reset','workspace']){
$(section).classList.toggle('hidden',section!==id);
}
}

function escapeHTML(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function errText(e){
return e?.message||'通信に失敗しました。もう一度お試しください。';
}

function setMessage(id,text,isError=false){
const el=$(id);
el.textContent=text;
el.classList.toggle('hidden',!text);
el.classList.toggle('error',isError);
}

function message(text,isError=false){
setMessage('workspaceMessage',text,isError);
}

function normalize(p){
return {
...p,
tasks:Array.isArray(p.tasks)?p.tasks:[]
};
}

function progress(p){
const tasks=Array.isArray(p.tasks)?p.tasks:[];
return tasks.length?
Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0;
}

function status(p){
return progress(p)===100?'完了':
p.tasks?.some(t=>t.done)?'進行中':'未着手';
}

function payload(p){
return {
name:p.name,
category:p.category,
assignee:p.assignee,
deadline:p.deadline||null,
priority:p.priority,
notes:p.notes,
tasks:p.tasks,
progress:progress(p),
status:status(p)
};
}

async function refresh(){
if(!currentUser||recoveryMode)return;

const version=++refreshVersion;
message('読み込み中…');

try{
const {data:rows,error}=await db.from('projects')
.select('id,name,category,assignee,deadline,priority,notes,tasks,progress,status')
.order('id',{ascending:false});

if(error)throw error;

if(version!==refreshVersion||!currentUser||recoveryMode)return;

data=(rows||[]).map(normalize);
message('');
render();
}catch(err){
if(version===refreshVersion){
message('読み込みエラー：'+errText(err),true);
}
}
}

function openForm(id){
if(busy||!currentUser)return;

form.reset();
$('projectId').value='';
$('formTitle').textContent='制作物を登録';

if(id!==undefined){
const p=data.find(x=>String(x.id)===String(id));
if(!p)return;

$('projectId').value=String(p.id);
$('projectName').value=p.name||'';
$('category').value=p.category||'その他';
$('assignee').value=p.assignee||'';
$('deadline').value=p.deadline||'';
$('priority').value=p.priority||'通常';
$('notes').value=p.notes||'';
$('formTitle').textContent='制作物を編集';
}

editor.showModal();
}

form.addEventListener('submit',async e=>{
e.preventDefault();
if(busy||!currentUser)return;

const id=$('projectId').value;
const category=$('category').value;
const old=id?data.find(x=>String(x.id)===id):null;

const p={
name:$('projectName').value.trim(),
category,
assignee:$('assignee').value.trim(),
deadline:$('deadline').value,
priority:$('priority').value,
notes:$('notes').value.trim(),
tasks:old&&old.category===category?
old.tasks:templates[category].map(name=>({name,done:false}))
};

if(!p.name)return;

busy=true;
$('saveButton').disabled=true;

try{
const query=id?
db.from('projects').update(payload(p)).eq('id',Number(id)).select('id'):
db.from('projects').insert(payload(p)).select('id');

const {data:result,error}=await query;
if(error)throw error;

if(!result?.length){
throw new Error('保存対象が見つかりません。アクセス権限を確認してください。');
}

editor.close();
await refresh();
}catch(err){
alert('保存できませんでした：'+errText(err));
}finally{
busy=false;
$('saveButton').disabled=false;
}
});

async function toggleTask(id,index,checked){
if(busy||!currentUser)return;

const p=data.find(x=>String(x.id)===String(id));
if(!p||!p.tasks[index])return;

const previous=p.tasks.map(t=>({...t}));
p.tasks[index].done=checked;
render();
busy=true;

try{
const {data:result,error}=await db.from('projects')
.update({
tasks:p.tasks,
progress:progress(p),
status:status(p)
})
.eq('id',Number(id))
.select('id');

if(error)throw error;

if(!result?.length){
throw new Error('更新対象が見つかりません。');
}

await refresh();
}catch(err){
p.tasks=previous;
render();
message('工程の保存に失敗：'+errText(err),true);
}finally{
busy=false;
}
}

async function deleteProject(id){
if(busy||!currentUser)return;
if(!confirm('この制作物を削除しますか？'))return;

busy=true;

try{
const {data:result,error}=await db.from('projects')
.delete()
.eq('id',Number(id))
.select('id');

if(error)throw error;

if(!result?.length){
throw new Error('削除対象が見つかりません。');
}

await refresh();
}catch(err){
message('削除できませんでした：'+errText(err),true);
}finally{
busy=false;
}
}

function render(){
const root=$('projects');
$('count').textContent=data.length+'件の制作物';

if(!data.length){
root.innerHTML='<div class="empty">制作物はまだ登録されていません。<p>「＋ 新規登録」から始めましょう。</p></div>';
return;
}

root.innerHTML=data.map(p=>{
const tasks=p.tasks;
const done=tasks.filter(t=>t.done).length;
const percent=progress(p);

const today=new Date();
const todayText=[
today.getFullYear(),
String(today.getMonth()+1).padStart(2,'0'),
String(today.getDate()).padStart(2,'0')
].join('-');

const overdue=p.deadline&&p.deadline<todayText&&percent<100;

return `<section class="card">
<div class="top">
<h2>${escapeHTML(p.name)}</h2>
<span class="tag">${escapeHTML(p.priority||'通常')}</span>
</div>

<p class="muted">
${escapeHTML(p.category||'その他')} ／
担当：${escapeHTML(p.assignee||'未設定')}
</p>

<p class="muted">
納期：${escapeHTML(p.deadline||'未設定')}
${overdue?'（期限超過）':''}
</p>

<div class="top">
<strong>進捗率</strong>
<strong>${percent}%</strong>
</div>

<div class="progress">
<div class="bar" style="width:${percent}%"></div>
</div>

<p class="muted">${done} / ${tasks.length} 工程完了</p>

${tasks.map((t,i)=>`<label class="task">
<input type="checkbox" ${t.done?'checked':''}
onchange="toggleTask(${Number(p.id)},${i},this.checked)">
<span>${escapeHTML(t.name)}</span>
</label>`).join('')}

${p.notes?`<p class="muted">備考：${escapeHTML(p.notes)}</p>`:''}

<div class="row">
<button class="secondary" onclick="openForm(${Number(p.id)})">編集</button>
<button class="danger" onclick="deleteProject(${Number(p.id)})">削除</button>
</div>
</section>`;
}).join('');
}

// ログイン
$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
if(!db)return;

setMessage('loginMessage','');
$('loginButton').disabled=true;

try{
const {error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});

if(error)throw error;

$('password').value='';
}catch(err){
setMessage('loginMessage',
'ログインできませんでした：'+errText(err),true);
}finally{
$('loginButton').disabled=false;
}
});

// パスワード再設定メール送信
$('forgotButton').addEventListener('click',async()=>{
if(!db)return;

let email=$('email').value.trim();

if(!email){
email=prompt('登録済みのメールアドレスを入力してください。')||'';
email=email.trim();
}

if(!email)return;

if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
setMessage('loginMessage','メールアドレスの形式を確認してください。',true);
return;
}

$('email').value=email;
$('forgotButton').disabled=true;

try{
const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:SITE_URL
});

if(error)throw error;

setMessage('loginMessage',
'再設定メールを送信しました。\nメール内の「Reset password」を開いて、新しいパスワードを設定してください。\n届かない場合は迷惑メールも確認してください。');
}catch(err){
setMessage('loginMessage',
'再設定メールを送れませんでした：'+errText(err),true);
}finally{
$('forgotButton').disabled=false;
}
});

// 新しいパスワードの登録
$('resetForm').addEventListener('submit',async e=>{
e.preventDefault();

if(!db||!recoveryMode)return;

const password=$('newPassword').value;
const confirmation=$('confirmPassword').value;

if(password.length<8){
setMessage('resetMessage',
'パスワードは8文字以上にしてください。',true);
return;
}

if(password!==confirmation){
setMessage('resetMessage',
'確認用パスワードが一致していません。',true);
return;
}

$('resetButton').disabled=true;
setMessage('resetMessage','保存しています…');

try{
const {error}=await db.auth.updateUser({
password:password
});

if(error)throw error;

$('newPassword').value='';
$('confirmPassword').value='';

recoveryMode=false;

const {error:signOutError}=await db.auth.signOut();
if(signOutError)throw signOutError;

currentUser=null;
data=[];
show('login');

setMessage('loginMessage',
'パスワードを設定しました。\n登録済みメールアドレスと新しいパスワードでログインしてください。');

window.history.replaceState(null,'',window.location.pathname);
}catch(err){
setMessage('resetMessage',
'パスワードの設定に失敗しました：'+errText(err),true);
}finally{
$('resetButton').disabled=false;
}
});

$('reloadButton').addEventListener('click',refresh);

$('logoutButton').addEventListener('click',async()=>{
if(!db)return;

const {error}=await db.auth.signOut();

if(error){
message('ログアウト失敗：'+errText(error),true);
}
});

async function setSession(session){
currentUser=session?.user||null;

if(recoveryMode){
show('reset');
return;
}

if(currentUser){
$('account').textContent=currentUser.email||'';
show('workspace');
await refresh();
}else{
refreshVersion++;
data=[];
show('login');
}
}

async function init(){
if(!window.supabase?.createClient){
show('setup');
$('setupMessage').textContent=
'Supabaseライブラリを読み込めませんでした。通信環境を確認してください。';
return;
}

try{
db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

// パスワード再設定リンクを最優先で処理
recoveryMode=recoveryLink;

db.auth.onAuthStateChange((event,session)=>{
// 認証イベント内で直接データベース通信しない
setTimeout(()=>{
if(event==='PASSWORD_RECOVERY'){
recoveryMode=true;
currentUser=session?.user||null;
show('reset');
return;
}

if(event==='SIGNED_OUT'){
if(recoveryMode)return;
setSession(null);
return;
}

if(event==='INITIAL_SESSION'||
event==='SIGNED_IN'){
setSession(session);
}
},0);
});

const {data:sessionData,error}=await db.auth.getSession();

if(error){
if(recoveryMode){
show('login');
recoveryMode=false;
setMessage('loginMessage',
'再設定リンクを確認できませんでした。新しい再設定メールを送ってください。',true);
}else{
show('login');
setMessage('loginMessage',errText(error),true);
}
return;
}

await setSession(sessionData.session);

const params=new URLSearchParams(window.location.hash.slice(1));
const urlError=params.get('error_description');

if(urlError){
recoveryMode=false;
show('login');
setMessage('loginMessage',
'認証リンクが無効または期限切れです。再設定メールを送り直してください。',true);
}

}catch(err){
show('setup');
$('setupMessage').textContent=
'初期化に失敗しました：'+errText(err);
}
}

init();
</script>
</body>
</html>
