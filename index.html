<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREATOR WORKSPACE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141e;color:#f5f5f5;font-family:-apple-system,'Helvetica Neue',sans-serif}header{background:#1d2635;text-align:center;padding:30px 12px}h1{font-size:24px;margin:0 0 8px}header p,.muted{color:#afbbce}main{max-width:900px;margin:auto;padding:16px}h2{font-size:20px}button,input,select,textarea{font:inherit}button{background:#80b5ff;color:#10141e;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#344256;color:white}button.danger{background:#653944;color:white}input,select,textarea{width:100%;background:#172132;color:white;border:1px solid #526078;border-radius:8px;padding:11px;margin:5px 0 12px}input[type=checkbox]{width:20px;height:20px;margin:0;flex-shrink:0}label{display:block;color:#cad4e4;font-size:14px}.card{background:#202b3b;border-radius:14px;padding:16px;margin:13px 0}.row,.top,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.toolbar{margin:14px 0}.toolbar select{margin:0;width:auto;max-width:100%}.muted{font-size:14px}.hidden{display:none!important}.message{white-space:pre-wrap;padding:12px;background:#344256;border-radius:8px}.error{background:#653944}.progress{height:12px;background:#3c4859;border-radius:20px;overflow:hidden}.bar{height:100%;background:#80b5ff}.tag{background:#344256;border-radius:18px;padding:5px 9px;font-size:12px}.task{display:flex;align-items:center;gap:9px;border-bottom:1px solid #394557;padding:9px 0}.task span{flex:1}.task-edit{display:flex;align-items:center;gap:5px;margin:8px 0}.task-edit input[type=text]{min-width:0;flex:1;margin:0}.task-edit button{padding:8px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal-day{background:#172132;border:1px solid #344256;border-radius:6px;min-height:66px;padding:4px;min-width:0}.cal-day strong,.cal-week{font-size:12px}.cal-week{text-align:center;color:#afbbce}.cal-item{display:block;background:#344b68;color:white;text-align:left;font-size:11px;padding:4px;margin:3px 0;width:100%;overflow-wrap:anywhere}.cal-other{opacity:.35}dialog{background:#202b3b;color:white;border:1px solid #526078;border-radius:14px;width:calc(100% - 24px);max-width:530px;max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}#login,#reset{max-width:450px;margin:20px auto}.linkbutton{background:none;color:#a9cbff;text-decoration:underline;padding:8px 0}#account{overflow-wrap:anywhere}button:focus-visible,input:focus-visible{outline:2px solid #80b5ff}
</style></head><body><header><h1>CREATOR WORKSPACE</h1><p>クリエイター制作管理システム</p></header><main>
<section id="setup" class="card hidden"><h2>接続設定が必要です</h2><p id="setupMessage"></p></section>
<section id="login" class="card hidden"><h2>ログイン</h2><form id="loginForm"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton">ログイン</button></form><p id="loginMessage" class="message hidden" role="status"></p><button type="button" class="linkbutton" id="forgotButton">パスワードを忘れた・初めて設定する</button></section>
<section id="reset" class="card hidden"><h2>新しいパスワードを設定</h2><form id="resetForm"><label>新しいパスワード<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>確認用<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button id="resetButton">パスワードを保存する</button></form><p id="resetMessage" class="message hidden"></p></section>
<section id="workspace" class="hidden"><div class="top"><div><h2>制作プロジェクト</h2><p id="count" class="muted"></p><p id="account" class="muted"></p></div><div class="row"><button id="newButton">＋ 新規登録</button><button class="secondary" id="reloadButton">更新</button><button class="secondary" id="logoutButton">ログアウト</button></div></div><p id="workspaceMessage" class="message hidden" role="status"></p>
<div class="toolbar"><label>担当者 <select id="assigneeFilter"><option value="">全員</option></select></label><label>並び順 <select id="sortOrder"><option value="deadline">納期順</option><option value="newest">登録順</option><option value="priority">優先度順</option></select></label></div>
<section class="card"><div class="top"><button class="secondary" id="prevMonth">前月</button><h2 id="monthTitle"></h2><button class="secondary" id="nextMonth">翌月</button></div><div id="calendar" class="calendar"></div><p class="muted">カレンダーには制作物の納期を表示します。タップすると編集できます。</p></section><div id="projects"></div></section></main>
<dialog id="editor"><h2 id="formTitle">制作物を登録</h2><form id="projectForm"><input id="projectId" type="hidden"><label>制作物の名前<input id="projectName" required></label><label>制作カテゴリ<select id="category"><option>衣装</option><option>ウィッグ</option><option>3Dプリンター</option><option>造形・小道具</option><option>展示品</option><option>その他</option></select></label><label>担当者<input id="assignee" placeholder="例：ねこ"></label><label>納期<input type="date" id="deadline"></label><label>優先度<select id="priority"><option>通常</option><option>高</option><option>最優先</option></select></label><label>備考<textarea id="notes" rows="3"></textarea></label><label>制作工程（追加・削除・順番変更）</label><div id="taskEditor"></div><button type="button" class="secondary" id="addTaskButton">＋ 工程を追加</button><div class="row"><button id="saveButton" type="submit">保存する</button><button type="button" class="secondary" id="cancelButton">キャンセル</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const SUPABASE_URL='https://wnvmhxzqnrtlvaiislkh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_dMpkJB_Pg6KQILD_T5tTOA_Bf5EsfdM';
const SITE_URL='https://nhkk6zprtg-gif.github.io/creator-workspace/';
const templates={'衣装':['資料確認','採寸・型紙','生地・材料調達','裁断','縫製','装飾','試着・調整','完成確認'],'ウィッグ':['資料確認','ウィッグ調達','カット','セット・造形','仕上げ','完成確認'],'3Dプリンター':['データ準備','スライス設定','材料準備','出力','サポート除去','研磨・塗装','完成確認'],'造形・小道具':['資料確認','設計・型紙','材料調達','造形','表面処理','塗装','完成確認'],'展示品':['企画','設計','材料調達','制作','組み立て','仕上げ','完成確認'],'その他':['準備','制作','確認','完成']};
const $=id=>document.getElementById(id);const editor=$('editor'),form=$('projectForm');let db=null,data=[],currentUser=null,busy=false,recoveryMode=false,refreshVersion=0,editingTasks=[];let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const recoveryLink=location.hash.includes('type=recovery')||location.search.includes('type=recovery');
function show(id){['setup','login','reset','workspace'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function errText(e){return e?.message||'通信に失敗しました。';}
function setMessage(id,t,error=false){const e=$(id);e.textContent=t;e.classList.toggle('hidden',!t);e.classList.toggle('error',error);}
function message(t,e=false){setMessage('workspaceMessage',t,e);}
function normalize(p){return {...p,tasks:Array.isArray(p.tasks)?p.tasks:[]};}
function progress(p){return p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0;}
function status(p){return p.tasks.length&&progress(p)===100?'完了':p.tasks.some(t=>t.done)?'進行中':'未着手';}
function payload(p){return {name:p.name,category:p.category,assignee:p.assignee,deadline:p.deadline||null,priority:p.priority,notes:p.notes,tasks:p.tasks,progress:progress(p),status:status(p)};}
async function refresh(){if(!currentUser||recoveryMode)return;const version=++refreshVersion;message('読み込み中…');try{const {data:rows,error}=await db.from('projects').select('id,name,category,assignee,deadline,priority,notes,tasks,progress,status').order('id',{ascending:false});if(error)throw error;if(version!==refreshVersion||!currentUser||recoveryMode)return;data=(rows||[]).map(normalize);message('');render();}catch(e){if(version===refreshVersion)message('読み込みエラー：'+errText(e),true);}}
function renderTaskEditor(){$('taskEditor').innerHTML=editingTasks.map((t,i)=>`<div class="task-edit"><input type="checkbox" data-check="${i}" ${t.done?'checked':''} aria-label="完了"><input type="text" data-name="${i}" value="${esc(t.name)}" aria-label="工程名"><button type="button" class="secondary" data-move="${i}" data-dir="-1">↑</button><button type="button" class="secondary" data-move="${i}" data-dir="1">↓</button><button type="button" class="danger" data-delete="${i}">×</button></div>`).join('');}
$('taskEditor').addEventListener('input',e=>{if(e.target.dataset.name!==undefined)editingTasks[+e.target.dataset.name].name=e.target.value;});
$('taskEditor').addEventListener('change',e=>{if(e.target.dataset.check!==undefined)editingTasks[+e.target.dataset.check].done=e.target.checked;});
$('taskEditor').addEventListener('click',e=>{const del=e.target.closest('[data-delete]');if(del){editingTasks.splice(+del.dataset.delete,1);renderTaskEditor();return;}const m=e.target.closest('[data-move]');if(m){const i=+m.dataset.move,j=i+(+m.dataset.dir);if(j>=0&&j<editingTasks.length){[editingTasks[i],editingTasks[j]]=[editingTasks[j],editingTasks[i]];renderTaskEditor();}}});
$('addTaskButton').addEventListener('click',()=>{editingTasks.push({name:'新しい工程',done:false});renderTaskEditor();});
$('category').addEventListener('change',()=>{if($('projectId').value)return;editingTasks=templates[$('category').value].map(name=>({name,done:false}));renderTaskEditor();});
function openForm(id){if(busy||!currentUser)return;form.reset();$('projectId').value='';$('formTitle').textContent='制作物を登録';editingTasks=templates[$('category').value].map(name=>({name,done:false}));if(id!==undefined){const p=data.find(x=>String(x.id)===String(id));if(!p)return;$('projectId').value=String(p.id);$('projectName').value=p.name||'';$('category').value=p.category||'その他';$('assignee').value=p.assignee||'';$('deadline').value=p.deadline||'';$('priority').value=p.priority||'通常';$('notes').value=p.notes||'';editingTasks=p.tasks.map(t=>({...t}));$('formTitle').textContent='制作物を編集';}renderTaskEditor();editor.showModal();}
$('newButton').addEventListener('click',()=>openForm());$('cancelButton').addEventListener('click',()=>editor.close());
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!currentUser)return;const id=$('projectId').value;const p={name:$('projectName').value.trim(),category:$('category').value,assignee:$('assignee').value.trim(),deadline:$('deadline').value,priority:$('priority').value,notes:$('notes').value.trim(),tasks:editingTasks.map(t=>({name:String(t.name).trim(),done:!!t.done})).filter(t=>t.name)};if(!p.name)return;busy=true;$('saveButton').disabled=true;try{const q=id?db.from('projects').update(payload(p)).eq('id',Number(id)).select('id'):db.from('projects').insert(payload(p)).select('id');const {data:result,error}=await q;if(error)throw error;if(!result?.length)throw Error('保存対象が見つかりません。');editor.close();await refresh();}catch(err){alert('保存できませんでした：'+errText(err));}finally{busy=false;$('saveButton').disabled=false;}});
async function toggleTask(id,index,checked){if(busy||!currentUser)return;const p=data.find(x=>String(x.id)===String(id));if(!p||!p.tasks[index])return;const old=p.tasks.map(t=>({...t}));p.tasks[index].done=checked;render();busy=true;try{const {data:result,error}=await db.from('projects').update({tasks:p.tasks,progress:progress(p),status:status(p)}).eq('id',Number(id)).select('id');if(error)throw error;if(!result?.length)throw Error('更新対象が見つかりません。');await refresh();}catch(err){p.tasks=old;render();message('工程の保存に失敗：'+errText(err),true);}finally{busy=false;}}
async function deleteProject(id){if(busy||!currentUser||!confirm('この制作物を削除しますか？'))return;busy=true;try{const {data:result,error}=await db.from('projects').delete().eq('id',Number(id)).select('id');if(error)throw error;if(!result?.length)throw Error('削除対象が見つかりません。');await refresh();}catch(err){message('削除できませんでした：'+errText(err),true);}finally{busy=false;}}
function renderCalendar(){const root=$('calendar'),y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();$('monthTitle').textContent=`${y}年${m+1}月`;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let html=['日','月','火','水','木','金','土'].map(d=>`<div class="cal-week">${d}</div>`).join('');for(let slot=0;slot<Math.ceil((first+days)/7)*7;slot++){const d=slot-first+1;if(d<1||d>days){html+='<div class="cal-day cal-other"></div>';continue;}const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const entries=data.filter(p=>p.deadline===key&&(!$('assigneeFilter').value||p.assignee===$('assigneeFilter').value));html+=`<div class="cal-day"><strong>${d}</strong>${entries.map(p=>`<button type="button" class="cal-item" onclick="openForm(${Number(p.id)})">${esc(p.name)}</button>`).join('')}</div>`;}root.innerHTML=html;}
function render(){const root=$('projects');$('count').textContent=data.length+'件の制作物';const sel=$('assigneeFilter'),chosen=sel.value,names=[...new Set(data.map(p=>p.assignee).filter(Boolean))].sort();sel.innerHTML='<option value="">全員</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');sel.value=names.includes(chosen)?chosen:'';renderCalendar();const rank={'最優先':0,'高':1,'通常':2},order=$('sortOrder').value;const visible=data.filter(p=>!sel.value||p.assignee===sel.value).sort((a,b)=>order==='priority'?(rank[a.priority]??3)-(rank[b.priority]??3):order==='newest'?Number(b.id)-Number(a.id):(a.deadline||'9999-12-31').localeCompare(b.deadline||'9999-12-31'));if(!visible.length){root.innerHTML='<div class="card muted">表示する制作物がありません。</div>';return;}const today=new Date(),todayText=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');root.innerHTML=visible.map(p=>{const done=p.tasks.filter(t=>t.done).length,percent=progress(p),overdue=p.deadline&&p.deadline<todayText&&percent<100;return `<section class="card"><div class="top"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.priority||'通常')}</span></div><p class="muted">${esc(p.category||'その他')} ／ 担当：${esc(p.assignee||'未設定')}</p><p class="muted">納期：${esc(p.deadline||'未設定')}${overdue?'（期限超過）':''}</p><div class="top"><strong>進捗率</strong><strong>${percent}%</strong></div><div class="progress"><div class="bar" style="width:${percent}%"></div></div><p class="muted">${done} / ${p.tasks.length} 工程完了</p>${p.tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${Number(p.id)},${i},this.checked)"><span>${esc(t.name)}</span></label>`).join('')}<p class="muted">${esc(p.notes||'')}</p><div class="row"><button class="secondary" onclick="openForm(${Number(p.id)})">編集・工程管理</button><button class="danger" onclick="deleteProject(${Number(p.id)})">削除</button></div></section>`;}).join('');}
$('reloadButton').addEventListener('click',refresh);$('assigneeFilter').addEventListener('change',render);$('sortOrder').addEventListener('change',render);$('prevMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendar();});$('nextMonth').addEventListener('click',()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendar();});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;$('loginButton').disabled=true;setMessage('loginMessage','');try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';}catch(err){setMessage('loginMessage','ログインできませんでした：'+errText(err),true);}finally{$('loginButton').disabled=false;}});
$('forgotButton').addEventListener('click',async()=>{if(!db)return;let email=$('email').value.trim();if(!email)email=(prompt('登録済みのメールアドレスを入力してください。')||'').trim();if(!email)return;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMessage('loginMessage','メールアドレスの形式を確認してください。',true);return;}$('email').value=email;$('forgotButton').disabled=true;try{const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});if(error)throw error;setMessage('loginMessage','再設定メールを送信しました。メール内のリンクから新しいパスワードを設定してください。');}catch(err){setMessage('loginMessage','送信に失敗：'+errText(err),true);}finally{$('forgotButton').disabled=false;}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();if(!db||!recoveryMode)return;const p=$('newPassword').value;if(p.length<8||p!==$('confirmPassword').value){setMessage('resetMessage','8文字以上で、確認用と同じパスワードを入力してください。',true);return;}$('resetButton').disabled=true;try{const {error}=await db.auth.updateUser({password:p});if(error)throw error;recoveryMode=false;await db.auth.signOut();currentUser=null;data=[];show('login');setMessage('loginMessage','パスワードを設定しました。新しいパスワードでログインしてください。');history.replaceState(null,'',location.pathname);}catch(err){setMessage('resetMessage','設定に失敗：'+errText(err),true);}finally{$('resetButton').disabled=false;}});
$('logoutButton').addEventListener('click',async()=>{if(!db)return;const {error}=await db.auth.signOut();if(error)message('ログアウト失敗：'+errText(error),true);});
async function setSession(session){currentUser=session?.user||null;if(recoveryMode){show('reset');return;}if(currentUser){$('account').textContent=currentUser.email||'';show('workspace');await refresh();}else{refreshVersion++;data=[];show('login');}}
async function init(){if(!window.supabase?.createClient){show('setup');$('setupMessage').textContent='Supabaseライブラリを読み込めませんでした。';return;}try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);recoveryMode=recoveryLink;db.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;currentUser=session?.user||null;show('reset');return;}if(event==='SIGNED_OUT'){if(!recoveryMode)setSession(null);return;}if(event==='INITIAL_SESSION'||event==='SIGNED_IN')setSession(session);},0);});const {data:sessionData,error}=await db.auth.getSession();if(error)throw error;await setSession(sessionData.session);const params=new URLSearchParams(location.hash.slice(1));if(params.get('error_description')){recoveryMode=false;show('login');setMessage('loginMessage','認証リンクが無効または期限切れです。',true);}}catch(err){show('setup');$('setupMessage').textContent='初期化に失敗：'+errText(err);}}
init();
</script></body></html>
