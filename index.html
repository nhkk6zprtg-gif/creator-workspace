
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CREATOR WORKSPACE</title>
  <style>
    body {
      margin: 0;
      background: #10141e;
      color: #f5f5f5;
      font-family: -apple-system, sans-serif;
    }
    header {
      background: #1d2635;
      padding: 30px 20px;
      text-align: center;
    }
    h1 { font-size: 24px; }
    main { padding: 20px; }
    .card {
      background: #202b3b;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .card h2 { font-size: 18px; }
    .card p { color: #aebccc; }
  </style>
</head>
<body>
  <header>
    <h1>CREATOR WORKSPACE</h1>
    <p>クリエイター制作管理システム</p>
  </header>

  <main>
    <div class="card">
      <h2>制作プロジェクト</h2>
      <p>衣装・ウィッグ・造形の進捗管理</p>
    </div>
    <div class="card">
      <h2>制作カレンダー</h2>
      <p>作業予定・納期管理</p>
    </div>
    <div class="card">
      <h2>作業日報</h2>
      <p>作業時間・進捗報告</p>
    </div>
    <div class="card">
      <h2>3Dプリンター</h2>
      <p>出力状況・材料管理</p>
    </div>
    <div class="card">
      <h2>制作原価</h2>
      <p>材料費・作業コスト管理</p>
    </div>
  </main>
</body>
</html>
